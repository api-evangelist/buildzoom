aid: buildzoom
name: BuildZoom
description: >-
  BuildZoom connects homeowners and property owners with vetted local general
  contractors, using data-driven matching across profiles for 4M+ licensed
  contractors and construction-permit history spanning hundreds of millions of
  projects. Alongside the contractor marketplace, BuildZoom operates the
  Building Permit Database (buildzoomdata.com) — a normalized dataset of 350M+
  building permits covering 25+ years, 2,400 jurisdictions, and 90% of the US
  population, plus 6M+ licensed contractors. That data is delivered through bulk
  data exports (weekly/monthly, full and incremental), a RESTful Data API with
  batch requests and sub-second latency for property permit history and
  contractor license/permit lookups, a Data Explorer web app, and a Permit Map.
  BuildZoom is backed by Andreessen Horowitz (a16z) and Y Combinator.
